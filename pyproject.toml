[project]
name = "kora-agent-baselines"
version = "0.1.0"
description = "Reusable Deep Agents Text-to-SQL and document RAG baselines"
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents>=0.7,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-deepseek>=1.0,<2",
    "langchain-nvidia-ai-endpoints>=1.4,<2",
    "langchain-openai>=1.0,<2",
    "requests>=2.31,<3",
    "PyJWT[crypto]>=2.8,<3",
    "langchain-text-splitters>=1.0,<2",
    "huggingface-hub>=0.35,<2",
    "gdown>=5,<6",
]

[tool.uv]
package = false
